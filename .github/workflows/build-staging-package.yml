name: Build Ekhaya Scents staging package

on:
  push:
    branches:
      - ekhaya-platform-v2
    paths:
      - ".github/workflows/build-staging-package.yml"
      - "v2/server/**"
      - "v2/database/schema.sql"
      - "v2/database/auth-additions.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: ekhaya-platform-v2

      - name: Assemble clean staging upload
        run: |
          set -euo pipefail
          mkdir -p dist/ekhaya-staging/public dist/ekhaya-staging/server/src dist/ekhaya-staging/database
          cp -a v2/server/public/. dist/ekhaya-staging/public/
          cp -a v2/server/src/. dist/ekhaya-staging/server/src/
          cp v2/server/config.example.php dist/ekhaya-staging/server/config.example.php
          cp v2/database/schema.sql v2/database/auth-additions.sql dist/ekhaya-staging/database/
          printf '%s\\n' \
            'Ekhaya Scents staging upload' \
            'Extract this archive directly into the existing /home/ACCOUNT/ekhaya-staging/ folder.' \
            'Copy the CONTENTS of public/ into the existing dev domain document root: /home/ACCOUNT/public_html/dev.ekhayascents.co.za/.' \
            'Keep server/ and database/ outside public_html. Never copy them into the web document root.' \
            'Copy server/config.example.php to server/config.local.php and set staging-only database credentials.' \
            'Set base_url and allowed_origins to https://dev.ekhayascents.co.za, environment=staging, timezone=Africa/Johannesburg, and a long random rate_limit_secret.' \
            'The API private root is configured in public/.htaccess for /home/robogirl/ekhaya-staging/server; adjust only if the hosting account username or folder changes.' \
            'Apply database/schema.sql then database/auth-additions.sql to a new empty staging database only.' \
            'Do not import production customer/order data or apply marketing-additions.sql.' \
            'Checkout is not implemented; do not accept payments or real orders on staging.' \
            'Preserve the existing php.ini separately if required by the host.' > dist/ekhaya-staging/DEPLOYMENT-NOTES.txt
          cd dist
          cd ekhaya-staging\n          zip -qr ../ekhaya-scents-staging-bundle.zip public server database DEPLOYMENT-NOTES.txt\n          cd ..
          unzip -t ekhaya-scents-staging-bundle.zip
          unzip -l ekhaya-scents-staging-bundle.zip

      - name: Upload staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: ekhaya-scents-staging-bundle
          path: dist/ekhaya-scents-staging-bundle.zip
          if-no-files-found: error
          retention-days: 7
