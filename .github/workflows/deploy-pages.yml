name: Deploy Ekhaya Scents V2 preview to GitHub Pages

on:
  push:
    branches:
      - ekhaya-platform-v2

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload V2 preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy V2 preview
        id: deployment
        uses: actions/deploy-pages@v4
