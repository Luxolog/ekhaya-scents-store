name: PHP backend syntax checks

on:
  push:
    branches: [ekhaya-platform-v2]
    paths:
      - 'v2/server/**/*.php'
      - 'v2/database/**/*.sql'
      - '.github/workflows/php-lint.yml'
  pull_request:
    branches: [ekhaya-platform-v2]
    paths:
      - 'v2/server/**/*.php'
      - 'v2/database/**/*.sql'
      - '.github/workflows/php-lint.yml'

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find v2/server -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
