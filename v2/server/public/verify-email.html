<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email | Ekhaya Scents</title><style>body{margin:0;background:#faf8f3;color:#171612;font:14px Arial}.wrap{max-width:460px;margin:12vh auto;padding:32px;background:white;border:1px solid #e4ded2}h1{font:36px Georgia}p{color:#777;line-height:1.7}a{color:#876a37}</style></head><body><main class="wrap"><h1>Verify your email.</h1><p id="msg">Confirming your email address…</p><p><a href="account.html">Go to your account</a></p></main><script>async function run(){const token=new URLSearchParams(location.search).get('token');if(!token){document.querySelector('#msg').textContent='This verification link is missing its token.';return}try{const c=await fetch('api/auth/csrf',{credentials:'same-origin'}).then(r=>r.json());const r=await fetch('api/auth/verify-email',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':c.csrf_token},body:JSON.stringify({token})});const j=await r.json();document.querySelector('#msg').textContent=r.ok?'Your email is verified and your account is active. You can now sign in.': 'This link is invalid or has expired. Please contact Ekhaya Scents for assistance.'}catch(e){document.querySelector('#msg').textContent='We could not verify your email right now. Please try again later.'}}run()</script></body></html>
