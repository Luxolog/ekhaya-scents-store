<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Ekhaya Scents</title><style>body{margin:0;background:#faf8f3;color:#171612;font:14px Arial}.wrap{max-width:460px;margin:9vh auto;padding:32px;background:white;border:1px solid #e4ded2}h1{font:36px Georgia}.gold{color:#9b783f}label{display:block;font-size:10px;letter-spacing:1px;margin:15px 0 6px}input{width:100%;padding:13px;border:1px solid #ded8cb;box-sizing:border-box}button{margin-top:20px;padding:14px 20px;background:#c6a66a;border:0;cursor:pointer;text-transform:uppercase;letter-spacing:1px}p{font-size:12px;color:#777;line-height:1.7}a{color:#876a37}</style></head><body><main class="wrap"><p class="gold">THE SCENT OF ORIGIN</p><h1>Create your account.</h1><p>We'll email you a verification link before your account is activated.</p><form id="f"><label>FIRST NAME</label><input name="first_name" maxlength="100"><label>LAST NAME</label><input name="last_name" maxlength="100"><label>EMAIL ADDRESS</label><input name="email" type="email" required><label>PASSWORD (12 CHARACTERS MINIMUM)</label><input name="password" type="password" minlength="12" required><button>Create account</button></form><p id="msg"></p><p><a href="account.html">Return to sign in</a></p></main><script>let csrf;async function req(path,data){let r=await fetch('api'+path,{method:data?'POST':'GET',credentials:'same-origin',headers:data?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error);return j}(async()=>{csrf=(await req('/auth/csrf')).csrf_token})();document.querySelector('#f').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{await req('/auth/register',d);document.querySelector('#msg').textContent='Account created. Check your email for the verification link.';e.target.reset()}catch(x){document.querySelector('#msg').textContent=x.message==='account_already_exists'?'An account with this email already exists.':x.message}}</script></body></html>
