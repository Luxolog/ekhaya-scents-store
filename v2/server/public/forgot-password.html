<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Ekhaya Scents</title><style>body{margin:0;background:#faf8f3;color:#171612;font:14px Arial}.wrap{max-width:440px;margin:10vh auto;padding:32px;background:white;border:1px solid #e4ded2}h1{font:36px Georgia}label{display:block;font-size:10px;letter-spacing:1px;margin:15px 0 6px}input{width:100%;padding:13px;border:1px solid #ded8cb;box-sizing:border-box}button{margin-top:20px;padding:14px 20px;background:#c6a66a;border:0;cursor:pointer}p{font-size:12px;color:#777;line-height:1.7}a{color:#876a37}</style></head><body><main class="wrap"><h1>Forgot your password?</h1><p>Enter your account email and we'll send a reset link if an account matches.</p><form id="f"><label>EMAIL ADDRESS</label><input name="email" type="email" required><button>Send reset link</button></form><p id="msg"></p><a href="account.html">Return to sign in</a></main><script>let csrf;async function call(path,data){let r=await fetch('api'+path,{method:data?'POST':'GET',credentials:'same-origin',headers:data?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error);return j}(async()=>csrf=(await call('/auth/csrf')).csrf_token)();document.querySelector('#f').onsubmit=async e=>{e.preventDefault();try{await call('/auth/password/forgot',Object.fromEntries(new FormData(e.target)));document.querySelector('#msg').textContent='If an account exists for that address, a reset email has been sent.'}catch(x){document.querySelector('#msg').textContent='Unable to process the request. Please try again later.'}}</script></body></html>
