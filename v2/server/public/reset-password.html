<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password | Ekhaya Scents</title><style>body{margin:0;background:#faf8f3;color:#171612;font:14px Arial}.wrap{max-width:440px;margin:10vh auto;padding:32px;background:white;border:1px solid #e4ded2}h1{font:36px Georgia}label{display:block;font-size:10px;letter-spacing:1px;margin:15px 0 6px}input{width:100%;padding:13px;border:1px solid #ded8cb;box-sizing:border-box}button{margin-top:20px;padding:14px 20px;background:#c6a66a;border:0;cursor:pointer}p{font-size:12px;color:#777;line-height:1.7}a{color:#876a37}</style></head><body><main class="wrap"><h1>Choose a new password.</h1><p>Use at least 12 characters.</p><form id="f"><label>NEW PASSWORD</label><input name="password" type="password" minlength="12" required><button>Update password</button></form><p id="msg"></p><a href="account.html">Return to sign in</a></main><script>let csrf;async function run(){const c=await fetch('api/auth/csrf',{credentials:'same-origin'}).then(r=>r.json());csrf=c.csrf_token}run();document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const token=new URLSearchParams(location.search).get('token');if(!token){document.querySelector('#msg').textContent='This reset link is missing its token.';return}try{const r=await fetch('api/auth/password/reset',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({token,password:new FormData(e.target).get('password')})});const j=await r.json();document.querySelector('#msg').textContent=r.ok?'Your password has been updated. You can now sign in.':'This reset link is invalid or has expired.'}catch(x){document.querySelector('#msg').textContent='Unable to update your password right now.'}}</script></body></html>
