<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11100e"><title>Product | Ekhaya Scents</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/styles.css"><style>.detail{max-width:1120px;margin:70px auto;padding:0 6vw;display:grid;grid-template-columns:1fr 1fr;gap:55px}.detail-media{background:#e9e3d8;min-height:460px;display:grid;place-items:center}.detail-media img{width:100%;height:100%;max-height:600px;object-fit:contain}.detail-info{align-self:center}.detail-info h1{font:clamp(36px,5vw,58px) "Playfair Display";margin:12px 0}.detail-price{font-size:20px;font-weight:700;margin:25px 0}.detail-description{color:#756e63;line-height:1.9;font-size:13px}.detail-info button{margin-top:25px}.detail-meta{font-size:10px;color:#8a806f;letter-spacing:1px;margin-top:20px}.back{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8b6e3e}@media(max-width:700px){.detail{grid-template-columns:1fr;margin:35px auto;gap:25px}.detail-media{min-height:300px}}</style></head>
<body><div class="announcement">THE SCENT OF ORIGIN</div><header class="site-header"><a class="wordmark" href="index.html"><span>EKHAYA</span><small>SCENTS</small></a><nav><a href="index.html#fragrances">Fragrances</a><a href="index.html#supplies">Perfume Supplies</a><a href="account.html">My Account</a></nav><a class="cart-trigger" href="index.html">BACK TO SHOP</a></header>
<main class="detail"><div class="detail-media" id="media"><div class="mini-bottle">EKHAYA</div></div><section class="detail-info"><a class="back" href="index.html">← Back to the collection</a><p class="eyebrow" id="category">EKHAYA SCENTS</p><h1 id="name">Loading product…</h1><p class="detail-price" id="price"></p><p class="detail-description" id="description"></p><p class="detail-meta" id="stock"></p><button class="button button-gold" id="add" disabled>Loading…</button><p class="muted">Secure checkout will be enabled after payment integration and testing.</p></section></main>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("en-ZA",{style:"currency",currency:"ZAR"}).format(Number(n||0));
(async()=>{const slug=new URLSearchParams(location.search).get("slug");if(!slug){document.getElementById("name").textContent="Product not found";return}try{const r=await fetch("api/products/"+encodeURIComponent(slug));const j=await r.json();if(!r.ok)throw Error();const p=j.product;document.title=p.name+" | Ekhaya Scents";document.getElementById("name").textContent=p.name;document.getElementById("category").textContent=(p.categories||[]).map(c=>c.name).join(" · ")||"EKHAYA SCENTS";document.getElementById("price").textContent=money(p.sale_price??p.regular_price);document.getElementById("description").textContent=p.description||p.short_description||"";document.getElementById("stock").textContent=p.stock_status==="in_stock"?"AVAILABLE":"Availability: "+p.stock_status.replace("_"," ").toUpperCase();const image=p.images?.[0];if(image?.source_path)document.getElementById("media").innerHTML='<img src="'+esc(image.source_path)+'" alt="'+esc(image.alt_text||p.name)+'">';const b=document.getElementById("add");b.disabled=p.stock_status!=="in_stock";b.textContent=b.disabled?"Currently unavailable":"Add to bag";b.onclick=()=>{sessionStorage.setItem("ekhaya_pending_cart_item",JSON.stringify({id:p.id,name:p.name,price:Number(p.sale_price??p.regular_price)}));alert("Product selected. Cart and secure checkout integration is the next development step.")}}catch(e){document.getElementById("name").textContent="Product not found";document.getElementById("description").textContent="This product may be unavailable or the catalogue is not yet connected."}})();
</script></body></html>
