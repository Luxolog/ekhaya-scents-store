<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11100e"><title>Product | Ekhaya Scents</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/styles.css"><style>.detail{max-width:1120px;margin:70px auto;padding:0 6vw;display:grid;grid-template-columns:1fr 1fr;gap:55px}.detail-media{background:#e9e3d8;min-height:460px;display:grid;place-items:center}.detail-media img{width:100%;height:100%;max-height:600px;object-fit:contain}.detail-info{align-self:center}.detail-info h1{font:clamp(36px,5vw,58px) "Playfair Display";margin:12px 0}.detail-price{font-size:20px;font-weight:700;margin:25px 0}.detail-description{color:#756e63;line-height:1.9;font-size:13px}.detail-info button{margin-top:25px}.detail-meta{font-size:10px;color:#8a806f;letter-spacing:1px;margin-top:20px}.back{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8b6e3e}@media(max-width:700px){.detail{grid-template-columns:1fr;margin:35px auto;gap:25px}.detail-media{min-height:300px}}.variant-picker{margin:24px 0}.variant-table-wrap{width:100%;overflow-x:auto}.variant-table{width:100%;border-collapse:collapse;font-size:14px}.variant-table th,.variant-table td{padding:15px 9px;border-bottom:1px solid #ded8cb;text-align:left}.variant-table th{font-weight:500;color:#81796c;white-space:nowrap}.variant-table td:nth-child(2){white-space:nowrap}.variant-qty,.single-buy input{width:76px;height:44px;border:1px solid #ded8cb;background:#fff;padding:8px;font:16px 'DM Sans',sans-serif}.variant-picker .button{margin-top:20px}.variant-empty{font-size:12px;color:#81796c}.single-buy{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.single-buy label{font-size:11px;color:#756e63;display:flex;align-items:center;gap:8px}@media(max-width:420px){.variant-table{font-size:12px}.variant-table th,.variant-table td{padding:12px 6px}.variant-qty{width:64px}}</style></head>
<body><div class="announcement">THE SCENT OF ORIGIN</div><header class="site-header"><a class="wordmark" href="index.html"><span>EKHAYA</span><small>SCENTS</small></a><nav><a href="index.html#fragrances">Fragrances</a><a href="index.html#supplies">Perfume Supplies</a><a href="account.html">My Account</a></nav><a class="cart-trigger" href="index.html">BACK TO SHOP</a></header>
<main class="detail"><div class="detail-media" id="media"><div class="mini-bottle">EKHAYA</div></div><section class="detail-info"><a class="back" href="index.html">← Back to the collection</a><p class="eyebrow" id="category">EKHAYA SCENTS</p><h1 id="name">Loading product…</h1><p class="detail-description" id="description"></p><p class="detail-meta" id="stock"></p><div id="variant-picker" class="variant-picker" aria-live="polite"></div><p class="muted" id="bag-note">Choose the sizes and quantities you want. Your selected items will be added separately to your bag.</p></section></main>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("en-ZA",{style:"currency",currency:"ZAR"}).format(Number(n||0));
const productPrice=p=>Number(p.sale_price!==null&&p.sale_price!==""?p.sale_price:p.regular_price||0);
const optionLabel=o=>{
 let values={};try{values=typeof o==="string"?JSON.parse(o||"{}"):(o||{});}catch{}
 const parts=Object.entries(values).map(([k,v])=>String(v).replace(/^pa_/,"").replace(/[-_]/g," ").replace(/^attribute /i,"").replace(/\b\w/g,c=>c.toUpperCase()));
 return parts.join(" / ")||"Standard";
};
(async()=>{
 const slug=new URLSearchParams(location.search).get("slug");
 if(!slug){document.getElementById("name").textContent="Product not found";return;}
 try{
  const r=await fetch("api/products/"+encodeURIComponent(slug));const j=await r.json();if(!r.ok)throw Error();
  const p=j.product;document.title=p.name+" | Ekhaya Scents";
  document.getElementById("name").textContent=p.name;
  document.getElementById("category").textContent=(p.categories||[]).map(c=>c.name).join(" · ")||"EKHAYA SCENTS";
  document.getElementById("description").textContent=p.description||p.short_description||"";
  document.getElementById("stock").textContent=p.stock_status==="in_stock"?"AVAILABLE":"Availability: "+String(p.stock_status||"").replaceAll("_"," ").toUpperCase();
  const image=p.images?.[0];if(image?.source_path)document.getElementById("media").innerHTML='<img src="'+esc(image.source_path)+'" alt="'+esc(image.alt_text||p.name)+'">';
  let variants=(p.variants||[]).map(v=>({id:String(v.id),label:optionLabel(v.option_values),price:Number(v.sale_price!==null&&v.sale_price!==""?v.sale_price:v.regular_price||0),stock:v.stock_status||p.stock_status}));
  const productContext=p.name+" "+(p.categories||[]).map(c=>c.name+" "+c.slug).join(" ");\n  const isOrigin=/origin|ubulumko|ubunono|ulonwabo|umoya|amandla|isibindi|isithunzi|ubukhosi/i.test(productContext);\n  const isBottle=/bottle|bottles|atomiser|atomizer/i.test(productContext);
  if(!variants.length&&isOrigin){
   variants=["30ml","50ml","100ml"].map(size=>({id:"size-"+size,label:size,price:productPrice(p),stock:p.stock_status}));
  }
  const picker=document.getElementById("variant-picker");
  if(!variants.length){
   const label=p.product_type==="variable"?"Product options have not been configured yet.":"Quantity";
   picker.innerHTML='<p class="variant-empty">'+label+'</p><div class="single-buy"><strong>'+money(productPrice(p))+' each</strong><label>Quantity <input id="single-qty" type="number" min="0" max="99" value="0" inputmode="numeric"></label><button class="button button-gold" id="single-add" '+(p.stock_status==="in_stock"?"":"disabled")+'>Add to bag</button></div>';
   document.getElementById("single-add").addEventListener("click",()=>{const qty=Math.max(0,Math.min(99,Math.floor(Number(document.getElementById("single-qty").value)||0)));if(!qty)return;addToBag({id:String(p.id),name:p.name,price:productPrice(p),qty});});
  }else{
   picker.innerHTML='<div class="variant-table-wrap"><table class="variant-table"><thead><tr><th>Size / style</th><th>Price each</th><th>Quantity</th></tr></thead><tbody>'+variants.map((v,i)=>'<tr><td>'+esc(v.label)+'</td><td>'+money(v.price)+'</td><td><input class="variant-qty" type="number" min="0" max="99" value="0" inputmode="numeric" aria-label="Quantity for '+esc(v.label)+'" data-index="'+i+'"></td></tr>').join("")+'</tbody></table></div><button class="button button-gold" id="add-selected">Add selected to bag</button>';
   document.getElementById("add-selected").addEventListener("click",()=>{
    const inputs=[...picker.querySelectorAll(".variant-qty")];let added=0;
    inputs.forEach(input=>{const qty=Math.max(0,Math.min(99,Math.floor(Number(input.value)||0)));if(!qty)return;const v=variants[Number(input.dataset.index)];if(v.stock!=="in_stock")return;addToBag({id:String(p.id)+"-variant-"+v.id,name:p.name+" — "+v.label,price:v.price,qty});added+=qty;});
    document.getElementById("bag-note").textContent=added?"Added "+added+" item(s) to your bag. You can continue shopping.":"Enter a quantity for at least one available size.";
   });
  }
 }catch(e){document.getElementById("name").textContent="Product not found";document.getElementById("description").textContent="This product may be unavailable or the catalogue is not yet connected.";}
})();
function addToBag(item){
 try{const key="ekhaya_store_cart_v1";const rows=JSON.parse(localStorage.getItem(key)||"[]");const found=rows.find(x=>String(x.id)===item.id);if(found)found.qty=Math.min(99,Number(found.qty||0)+item.qty);else rows.push(item);localStorage.setItem(key,JSON.stringify(rows));document.getElementById("bag-note").textContent="Added to your bag on this device. Secure checkout will be enabled after order and payment integration are tested.";}catch(e){document.getElementById("bag-note").textContent="We couldn't save your bag on this device. Please try again.";}
}
</script></body></html>
